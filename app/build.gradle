plugins {
    id 'com.android.application'
}

// Optional release signing. Put these in local.properties (never committed) to use your own key:
//   STORELOCATION=/path/to/keystore.jks
//   STOREPASSWORD=...
//   KEYPASSWORD=...
// Without them, every build type is signed with the standard Android debug key.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def hasReleaseKey = localProperties['STORELOCATION'] != null

android {
    namespace 'sksa.aa.tweaker'
    compileSdk 35

    defaultConfig {
        applicationId 'sksa.aa.tweaker'
        minSdk 23
        targetSdk 34
        versionCode 39
        versionName '5.2.2-wr5'
        setProperty('archivesBaseName', 'AA-AIO-TWEAKER-' + versionName)
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(localProperties['STORELOCATION'])
                storePassword localProperties['STOREPASSWORD']
                keyAlias 'key0'
                keyPassword localProperties['KEYPASSWORD']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'com.google.android.material:material:1.12.0'
    // Only used to tell whether Android Auto is currently connected.
    implementation 'androidx.car.app:app:1.4.0'
    testImplementation 'junit:junit:4.13.2'
}
